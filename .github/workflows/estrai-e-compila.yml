name: Estrai e compila APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai il progetto
        run: unzip -o SpesaDiOggi_v4_10righe.zip

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: SpesaDiOggi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
